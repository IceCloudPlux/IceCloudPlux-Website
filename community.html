<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IceCloud & Plux · 社区</title>
    <style>
        /* 复用相同的 CSS 变量、导航栏等样式（与 index.html 相同） */
        :root { --bg-primary:#0b0d15; --bg-secondary:#131620; --bg-card:rgba(255,255,255,0.04); --bg-nav:rgba(11,13,21,0.0); --text-primary:#e8eaf0; --text-secondary:#9ca3af; --text-muted:#6b7280; --border-color:rgba(255,255,255,0.06); --accent:#7c3aed; --accent-light:#a78bfa; --accent-gradient:linear-gradient(135deg,#7c3aed,#a855f7); --shadow:0 4px 24px rgba(0,0,0,0.4); --nav-blur:12px; }
        [data-theme="light"] { --bg-primary:#f8fafc; --bg-secondary:#ffffff; --bg-card:rgba(0,0,0,0.03); --bg-nav:rgba(248,250,252,0.0); --text-primary:#0f172a; --text-secondary:#475569; --text-muted:#94a3b8; --border-color:rgba(0,0,0,0.06); --accent:#7c3aed; --accent-light:#8b5cf6; --shadow:0 4px 24px rgba(0,0,0,0.08); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg-primary); color:var(--text-primary); line-height:1.6; transition:background 0.3s,color 0.3s; }
        a { color:inherit; text-decoration:none; }
        .container { max-width:1200px; margin:0 auto; padding:0 24px; }
        .navbar { position:fixed; top:0; left:0; right:0; z-index:1000; padding:16px 0; transition:background 0.3s,box-shadow 0.3s,border-color 0.3s; background:var(--bg-nav); border-bottom:1px solid transparent; }
        .navbar.scrolled { background:var(--bg-secondary); border-bottom-color:var(--border-color); box-shadow:0 2px 20px rgba(0,0,0,0.1); }
        [data-theme="light"] .navbar.scrolled { background:rgba(255,255,255,0.85); backdrop-filter:blur(var(--nav-blur)); }
        [data-theme="dark"] .navbar.scrolled { background:rgba(11,13,21,0.85); backdrop-filter:blur(var(--nav-blur)); }
        .navbar .container { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
        .brand { font-size:1.3rem; font-weight:700; color:var(--text-primary); }
        .brand .highlight { color:var(--accent-light); }
        .nav-links { display:flex; gap:20px; font-size:0.95rem; }
        .nav-links a { color:var(--text-secondary); transition:color 0.2s; }
        .nav-links a:hover { color:var(--text-primary); }
        .nav-divider { width:1px; height:24px; background:var(--border-color); }
        .theme-toggle { display:flex; align-items:center; gap:6px; cursor:pointer; }
        .theme-toggle .toggle-track { width:40px; height:22px; border-radius:30px; background:var(--border-color); position:relative; }
        .theme-toggle .toggle-thumb { width:18px; height:18px; border-radius:50%; background:white; position:absolute; top:2px; left:2px; transition:transform 0.3s; }
        [data-theme="dark"] .theme-toggle .toggle-track { background:var(--accent); }
        [data-theme="dark"] .theme-toggle .toggle-thumb { transform:translateX(18px); }
        .hero { padding:120px 0 40px; text-align:center; }
        .hero h1 { font-size:2.5rem; font-weight:800; }
        .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:24px; margin-top:32px; }
        .card { background:var(--bg-card); border:1px solid var(--border-color); border-radius:16px; padding:24px; text-align:center; transition:all 0.3s; }
        .card:hover { transform:translateY(-4px); border-color:var(--accent); }
        .card h3 { font-size:1.3rem; font-weight:700; margin-bottom:8px; }
        .card p { color:var(--text-secondary); font-size:0.9rem; }
        .card .btn { display:inline-block; margin-top:16px; padding:8px 24px; border-radius:20px; background:var(--accent-gradient); color:#fff; font-weight:600; }
        .footer { padding:32px 0; border-top:1px solid var(--border-color); text-align:center; color:var(--text-muted); margin-top:48px; }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="/" class="brand"><span class="highlight">IceCloud</span>&nbsp;&amp;&nbsp;Plux</a>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="community">社区</a>
                <a href="sponsor">赞助</a>
                <a href="stats">运行统计</a>
                <span class="nav-divider"></span>
                <div class="theme-toggle" id="themeToggle" role="button" tabindex="0">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </div>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <h1>👋 加入社区</h1>
            <p style="color:var(--text-secondary);">在这里找到我们，获取最新动态、技术支持，或与其他服主交流。</p>
        </div>
    </section>

    <div class="container">
        <div class="cards">
            <div class="card">
                <h3>🐙 GitHub</h3>
                <p>源码开放，欢迎 Star、Fork 和提交 Pull Request。</p>
                <a href="https://github.com/IcecloudPlux" target="_blank" class="btn">访问仓库</a>
            </div>
            <div class="card">
                <h3>💬 Discord</h3>
                <p>即时交流，反馈问题，参与测试讨论。</p>
                <a href="https://discord.gg/BJS7KdSG" target="_blank" class="btn">加入服务器</a>
            </div>
            <div class="card">
                <h3>🐧 QQ 群</h3>
                <p>国内服主交流，插件使用疑问，版本更新通知。</p>
                <a href="https://qm.qq.com/q/Kfelqf0iEs" target="_blank" class="btn">加入群聊</a>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 IceCloud & Plux Dev</p>
    </footer>

    <script>
        (function(){
            const toggle=document.getElementById('themeToggle');
            const html=document.documentElement;
            html.setAttribute('data-theme', localStorage.getItem('theme')||'dark');
            toggle.addEventListener('click',()=>{
                const next=html.getAttribute('data-theme')==='dark'?'light':'dark';
                html.setAttribute('data-theme',next);
                localStorage.setItem('theme',next);
            });
            const navbar=document.getElementById('navbar');
            window.addEventListener('scroll',()=>navbar.classList.toggle('scrolled',window.pageYOffset>20));
        })();
    </script>
</body>
</html>
