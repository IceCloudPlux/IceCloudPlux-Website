<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 · GtPlux</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ================= 页面专属样式 ================= */
        .tab-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid var(--border-color, #333);
            background: var(--bg-card, rgba(255,255,255,0.04));
            color: var(--text-secondary, #9ca3af);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.25s;
        }
        .tab-btn.active {
            background: var(--accent-gradient, linear-gradient(135deg,#7c3aed,#a855f7));
            color: #fff;
            border-color: transparent;
        }
        .panel { display: none; }
        .panel.active { display: block; }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .sub-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .sub-tab {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color, #333);
            background: var(--bg-card, rgba(255,255,255,0.04));
            color: var(--text-secondary, #9ca3af);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.25s;
        }
        .sub-tab.active {
            background: var(--accent-gradient, linear-gradient(135deg,#7c3aed,#a855f7));
            color: #fff;
            border-color: transparent;
        }

        /* 加载状态 */
        .table-loading {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted, #6b7280);
        }
        .table-loading .spinner {
            display: inline-block;
            width: 24px; height: 24px;
            border: 3px solid var(--border-color, #333);
            border-top-color: var(--accent, #7c3aed);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .table-error {
            text-align: center;
            padding: 24px 0;
            color: #ef4444;
            font-size: 0.9rem;
        }
        .table-error button {
            margin-left: 8px;
            padding: 4px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            border: 1px solid #ef4444;
            background: transparent;
            color: #ef4444;
            cursor: pointer;
        }

        /* 让操作按钮更紧凑 */
        .btn-sm {
            padding: 4px 12px !important;
            font-size: 0.8rem !important;
        }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="/shop.html" class="brand"><span class="highlight">IceCloud</span> &amp; Plux</a>
            <div class="nav-links">
                <a href="/shop.html">商店</a>
                <a href="/admin.html">管理</a>
                <span class="nav-divider"></span>
                <div class="theme-toggle" id="themeToggle" role="button" tabindex="0" aria-label="切换主题">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- 登录界面 -->
    <section class="login-section" id="loginSection">
        <div class="login-box">
            <h2>🔐 管理员登录</h2>
            <p>请输入您的 GitHub Personal Access Token（需 <code>repo</code> 权限）</p>
            <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx">
            <button class="btn btn-primary" id="loginBtn" style="width:100%;">登录后台</button>
            <div class="error-msg" id="loginError"></div>
        </div>
    </section>

    <!-- 管理主界面 -->
    <section class="container" id="adminSection" style="padding-top: 100px; padding-bottom: 40px; display: none;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:24px;">
            <h1 style="font-size: 2rem; font-weight: 800;">⚙️ 管理后台</h1>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-secondary" onclick="refreshAll()" title="强制刷新所有数据">🔄 刷新</button>
                <button class="btn btn-secondary" onclick="logout()">退出登录</button>
            </div>
        </div>

        <!-- 主标签页 -->
        <div class="tab-bar">
            <button class="tab-btn active" data-panel="products">📦 产品管理</button>
            <button class="tab-btn" data-panel="licenses">🔑 许可证管理</button>
            <button class="tab-btn" data-panel="plugins">📁 插件管理</button>
        </div>

        <!-- 面板1: 产品管理 -->
        <div id="panel-products" class="panel active">
            <div class="action-bar">
                <h2 style="font-size:1.3rem;">产品列表</h2>
                <button class="btn btn-primary" onclick="openProductModal()">+ 添加产品</button>
            </div>
            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>ID</th><th>名称</th><th>版本</th><th>MC版本</th><th>价格</th><th>发布日期</th><th>下载链接</th><th>操作</th></tr></thead>
                        <tbody id="productTableBody"><tr><td colspan="8" class="table-loading"><div class="spinner"></div><div>加载中…</div></td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 面板2: 许可证管理 -->
        <div id="panel-licenses" class="panel">
            <div class="action-bar">
                <h2 style="font-size:1.3rem;">许可证列表</h2>
                <button class="btn btn-primary" onclick="openLicenseModal()">+ 添加许可证</button>
            </div>
            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>ID</th><th>许可证</th><th>关联产品</th><th>到期日期</th><th>最大服务器</th><th>已激活</th><th>操作</th></tr></thead>
                        <tbody id="licenseTableBody"><tr><td colspan="7" class="table-loading"><div class="spinner"></div><div>切换到本页时加载…</div></td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 面板3: 插件管理 -->
        <div id="panel-plugins" class="panel">
            <div class="action-bar">
                <h2 style="font-size:1.3rem;">插件列表</h2>
                <button class="btn btn-primary" onclick="openPluginModal()">+ 添加插件</button>
            </div>
            <div class="sub-tabs" id="pluginSubTabs">
                <button class="sub-tab active" data-file="icecloud_plugins">❄️ IceCloud</button>
                <button class="sub-tab" data-file="plux_plugins">✨ Plux</button>
                <button class="sub-tab" data-file="special_plugins">🔧 特殊插件</button>
            </div>
            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>名称</th><th>版本</th><th>MC版本</th><th>发布日期</th><th>下载链接</th><th>操作</th></tr></thead>
                        <tbody id="pluginTableBody"><tr><td colspan="6" class="table-loading"><div class="spinner"></div><div>切换到本页时加载…</div></td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!-- 模态框（通用） -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <div class="modal-header">
                <h3 id="modalTitle">标题</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>Made with <span class="heart">❤️</span> by IceCloud &amp; Plux Dev</p>
        </div>
    </footer>

    <script>
    /* ============================================================
       配置
       ============================================================ */
    const GITHUB_OWNER = 'IceCloudPlux';
    const GITHUB_REPO  = 'IceCloudPlux.github.io';
    const GITHUB_BRANCH = 'main';
    const DATA_DIR = '_data';
    const CACHE_TTL = 5 * 60 * 1000;    // 数据缓存 5 分钟
    const TOKEN_TTL = 30 * 1000;        // Token 验证缓存 30 秒
    const REQUEST_TIMEOUT = 15000;       // 请求超时 15 秒

    /* ============================================================
       工具函数（内联，不再依赖 common.js）
       ============================================================ */
    function getToken() { return localStorage.getItem('gh_token') || ''; }
    function setToken(t) { localStorage.setItem('gh_token', t); }
    function clearToken() { localStorage.removeItem('gh_token'); }

    function initTheme() {
        const theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
    }
    function toggleTheme() {
        const html = document.documentElement;
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    }
    function initNavbarScroll() {
        const navbar = document.getElementById('navbar');
        if (!navbar) return;
        const onScroll = () => navbar.classList.toggle('scrolled', window.pageYOffset > 20);
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
    }

    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
    }

    // 简单 base64 混淆（如果原 common.js 的算法不同，请替换为一致实现）
    function encodeObscure64(plain) {
        return btoa(unescape(encodeURIComponent(plain)));
    }
    function decodeObscure64(encoded) {
        try {
            return decodeURIComponent(escape(atob(encoded)));
        } catch (e) {
            return encoded;
        }
    }

    /* ============================================================
       fetch 带超时
       ============================================================ */
    function fetchWithTimeout(url, options = {}) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);
        return fetch(url, { ...options, signal: controller.signal })
            .finally(() => clearTimeout(timeoutId));
    }

    /* ============================================================
       数据层：读取 + 缓存
       ============================================================ */
    const _dataCache = {};   // { name: { data, time, sha } }

    async function loadData(name, token, forceRefresh = false) {
        const now = Date.now();
        const cached = _dataCache[name];
        if (!forceRefresh && cached && (now - cached.time < CACHE_TTL)) {
            return cached.data;
        }

        const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_DIR}/${name}.json?ref=${GITHUB_BRANCH}`;
        const res = await fetchWithTimeout(url, {
            headers: { 'Authorization': `token ${token}` }
        });

        if (res.status === 404) {
            // 文件不存在，返回空数组并缓存
            _dataCache[name] = { data: [], time: now, sha: null };
            return [];
        }
        if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
        }

        const json = await res.json();
        const buffer = await (await fetch(json.download_url, { cache: 'no-cache' })).arrayBuffer();
        const text = new TextDecoder('utf-8').decode(buffer);
        const data = JSON.parse(text);

        _dataCache[name] = { data, time: now, sha: json.sha };
        return data;
    }

    async function saveData(name, data, token, message) {
        const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_DIR}/${name}.json`;
        let sha = _dataCache[name]?.sha || null;

        // 如果没有缓存 sha，先去获取
        if (!sha) {
            const getRes = await fetchWithTimeout(`${url}?ref=${GITHUB_BRANCH}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (getRes.ok) {
                const j = await getRes.json();
                sha = j.sha;
            }
        }

        const body = {
            message: message || `更新 ${name}`,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
            branch: GITHUB_BRANCH
        };
        if (sha) body.sha = sha;

        const putRes = await fetchWithTimeout(url, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });

        if (!putRes.ok) {
            const err = await putRes.json().catch(() => ({}));
            throw new Error(err.message || `保存失败 HTTP ${putRes.status}`);
        }

        const result = await putRes.json();
        // 更新缓存
        _dataCache[name] = {
            data: data,
            time: Date.now(),
            sha: result.content?.sha || null
        };
    }

    /* ============================================================
       Token 验证（带缓存）
       ============================================================ */
    let _tokenCache = { token: '', time: 0, valid: false };
    async function verifyToken(t) {
        const now = Date.now();
        if (_tokenCache.token === t && (now - _tokenCache.time < TOKEN_TTL)) {
            return _tokenCache.valid;
        }
        try {
            const res = await fetchWithTimeout('https://api.github.com/user', {
                headers: { 'Authorization': `token ${t}` }
            });
            const valid = res.ok;
            _tokenCache = { token: t, time: now, valid };
            return valid;
        } catch (e) {
            return false;
        }
    }

    /* ============================================================
       状态
       ============================================================ */
    let token = getToken();
    let productsData = [];
    let licensesData = [];
    let pluginsData = [];
    let currentPluginFile = 'icecloud_plugins';

    // 记录哪些 tab 数据已加载
    const loaded = { products: false, licenses: false, plugins: {} };

    /* ============================================================
       初始化
       ============================================================ */
    initTheme();
    initNavbarScroll();
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    document.getElementById('themeToggle').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTheme(); }
    });

    /* ============================================================
       登录 / 登出
       ============================================================ */
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');

    loginBtn.addEventListener('click', login);
    document.getElementById('tokenInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') login();
    });

    async function login() {
        const inputToken = document.getElementById('tokenInput').value.trim();
        if (!inputToken) {
            loginError.textContent = '请输入 Token';
            return;
        }
        loginError.textContent = '正在验证…';
        loginBtn.disabled = true;
        loginBtn.textContent = '验证中…';

        token = inputToken;
        const valid = await verifyToken(token);

        loginBtn.disabled = false;
        loginBtn.textContent = '登录后台';

        if (!valid) {
            loginError.textContent = 'Token 无效或网络异常，请重试';
            token = '';
            return;
        }

        setToken(token);
        loginError.textContent = '';
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminSection').style.display = 'block';

        // 只加载当前 tab（产品）数据
        await loadProductsIfNeeded();
    }

    function logout() {
        if (confirm('确定退出登录吗？')) {
            clearToken();
            token = '';
            // 清理缓存
            for (const key in _dataCache) delete _dataCache[key];
            loaded.products = false;
            loaded.licenses = false;
            loaded.plugins = {};
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('adminSection').style.display = 'none';
            document.getElementById('tokenInput').value = '';
        }
    }

    // 自动登录
    (async () => {
        if (!token) return;
        const valid = await verifyToken(token);
        if (valid) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminSection').style.display = 'block';
            await loadProductsIfNeeded();
        } else {
            clearToken();
            token = '';
        }
    })();

    /* ============================================================
       标签页切换（按需加载）
       ============================================================ */
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            const panel = this.dataset.panel;
            document.getElementById('panel-' + panel).classList.add('active');

            // 按需加载
            if (panel === 'products') loadProductsIfNeeded();
            else if (panel === 'licenses') loadLicensesIfNeeded();
            else if (panel === 'plugins') loadPluginsIfNeeded();
        });
    });

    document.querySelectorAll('#pluginSubTabs .sub-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('#pluginSubTabs .sub-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            currentPluginFile = this.dataset.file;
            loadPluginsIfNeeded(true);
        });
    });

    /* ============================================================
       按需加载
       ============================================================ */
    async function loadProductsIfNeeded(force = false) {
        if (loaded.products && !force) return;
        const tbody = document.getElementById('productTableBody');
        tbody.innerHTML = `<tr><td colspan="8" class="table-loading"><div class="spinner"></div><div>加载中…</div></td></tr>`;
        try {
            productsData = await loadData('products', token, force);
            loaded.products = true;
            renderProductTable();
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="8" class="table-error">加载失败：${escapeHtml(err.message)} <button onclick="loadProductsIfNeeded(true)">重试</button></td></tr>`;
        }
    }

    async function loadLicensesIfNeeded(force = false) {
        if (loaded.licenses && !force) return;
        const tbody = document.getElementById('licenseTableBody');
        tbody.innerHTML = `<tr><td colspan="7" class="table-loading"><div class="spinner"></div><div>加载中…</div></td></tr>`;
        try {
            // 许可证需要产品数据来显示产品名，所以先确保产品加载
            if (!loaded.products) productsData = await loadData('products', token);
            licensesData = await loadData('licenses', token, force);
            loaded.licenses = true;
            renderLicenseTable();
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="7" class="table-error">加载失败：${escapeHtml(err.message)} <button onclick="loadLicensesIfNeeded(true)">重试</button></td></tr>`;
        }
    }

    async function loadPluginsIfNeeded(force = false) {
        const key = currentPluginFile;
        if (loaded.plugins[key] && !force) return;
        const tbody = document.getElementById('pluginTableBody');
        tbody.innerHTML = `<tr><td colspan="6" class="table-loading"><div class="spinner"></div><div>加载中…</div></td></tr>`;
        try {
            pluginsData = await loadData(key, token, force);
            loaded.plugins[key] = true;
            renderPluginTable();
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="6" class="table-error">加载失败：${escapeHtml(err.message)} <button onclick="loadPluginsIfNeeded(true)">重试</button></td></tr>`;
        }
    }

    // 强制刷新所有已加载的数据
    async function refreshAll() {
        const activePanel = document.querySelector('.tab-btn.active').dataset.panel;
        if (activePanel === 'products') await loadProductsIfNeeded(true);
        else if (activePanel === 'licenses') await loadLicensesIfNeeded(true);
        else if (activePanel === 'plugins') await loadPluginsIfNeeded(true);
    }

    /* ============================================================
       渲染表格
       ============================================================ */
    function renderProductTable() {
        const tbody = document.getElementById('productTableBody');
        if (!productsData || productsData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--text-muted);">暂无产品</td></tr>`;
            return;
        }
        tbody.innerHTML = productsData.map((p, idx) => `
            <tr>
                <td>${p.id ?? idx + 1}</td>
                <td>${escapeHtml(p.name)}</td>
                <td>${escapeHtml(p.version)}</td>
                <td>${escapeHtml(p.mc_version)}</td>
                <td>¥${Number(p.price).toFixed(2)}</td>
                <td>${escapeHtml(p.date)}</td>
                <td>${p.download_url ? `<a href="${escapeHtml(p.download_url)}" target="_blank">链接</a>` : '-'}</td>
                <td>
                    <button class="btn btn-secondary btn-sm" onclick="editProduct(${idx})">编辑</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteProduct(${idx})">删除</button>
                </td>
            </tr>
        `).join('');
    }

    function renderLicenseTable() {
        const tbody = document.getElementById('licenseTableBody');
        if (!licensesData || licensesData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-muted);">暂无许可证</td></tr>`;
            return;
        }
        tbody.innerHTML = licensesData.map((l, idx) => {
            const product = productsData.find(p => p.id === l.product_id);
            const productName = product ? product.name : '未知';
            return `
                <tr>
                    <td>${l.id ?? idx + 1}</td>
                    <td><code>${escapeHtml(l.license_key)}</code></td>
                    <td>${escapeHtml(productName)}</td>
                    <td>${escapeHtml(l.expiry_date || '-')}</td>
                    <td>${l.max_servers ?? 1}</td>
                    <td>${(l.activated_servers || []).length}</td>
                    <td>
                        <button class="btn btn-secondary btn-sm" onclick="editLicense(${idx})">编辑</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteLicense(${idx})">删除</button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function renderPluginTable() {
        const tbody = document.getElementById('pluginTableBody');
        if (!pluginsData || pluginsData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-muted);">暂无插件数据</td></tr>`;
            return;
        }
        tbody.innerHTML = pluginsData.map((p, idx) => `
            <tr>
                <td>${escapeHtml(p.title || p.name)}</td>
                <td>${escapeHtml(p.version)}</td>
                <td>${escapeHtml(p.mc_version)}</td>
                <td>${escapeHtml(p.date)}</td>
                <td>${p.download_url ? `<a href="${escapeHtml(p.download_url)}" target="_blank">链接</a>` : '-'}</td>
                <td>
                    <button class="btn btn-secondary btn-sm" onclick="editPlugin(${idx})">编辑</button>
                    <button class="btn btn-danger btn-sm" onclick="deletePlugin(${idx})">删除</button>
                </td>
            </tr>
        `).join('');
    }

    /* ============================================================
       产品 CRUD
       ============================================================ */
    function openProductModal(index) {
        const isEdit = index !== undefined;
        const p = isEdit ? productsData[index] : {};
        document.getElementById('modalTitle').textContent = isEdit ? '编辑产品' : '添加产品';
        document.getElementById('modalBody').innerHTML = `
            <form id="productForm">
                <input type="hidden" id="productIndex" value="${isEdit ? index : ''}">
                <div class="form-row">
                    <div class="form-group"><label>产品名称 *</label><input type="text" id="pName" value="${escapeHtml(p.name || '')}" required></div>
                    <div class="form-group"><label>版本 *</label><input type="text" id="pVersion" value="${escapeHtml(p.version || '')}" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>MC 版本 *</label><input type="text" id="pMc" value="${escapeHtml(p.mc_version || '')}" required></div>
                    <div class="form-group"><label>价格 (CNY) *</label><input type="number" step="0.01" id="pPrice" value="${p.price ?? ''}" required></div>
                </div>
                <div class="form-group"><label>描述</label><input type="text" id="pDesc" value="${escapeHtml(p.description || '')}"></div>
                <div class="form-row">
                    <div class="form-group"><label>发布日期 *</label><input type="date" id="pDate" value="${p.date || ''}" required></div>
                    <div class="form-group"><label>下载链接</label><input type="url" id="pUrl" value="${escapeHtml(p.download_url || '')}"></div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        `;
        openModal();

        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const idx = document.getElementById('productIndex').value;
            const newProduct = {
                id: isEdit ? p.id : (productsData.length ? Math.max(...productsData.map(x => x.id || 0)) + 1 : 1),
                name: document.getElementById('pName').value.trim(),
                version: document.getElementById('pVersion').value.trim(),
                mc_version: document.getElementById('pMc').value.trim(),
                price: parseFloat(document.getElementById('pPrice').value),
                description: document.getElementById('pDesc').value.trim(),
                date: document.getElementById('pDate').value,
                download_url: document.getElementById('pUrl').value.trim()
            };
            if (idx === '') productsData.push(newProduct);
            else productsData[parseInt(idx)] = newProduct;

            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = '保存中…';
            try {
                await saveData('products', productsData, token, '更新产品列表');
                renderProductTable();
                closeModal();
            } catch (err) {
                alert('保存失败：' + err.message);
                submitBtn.disabled = false;
                submitBtn.textContent = '保存';
            }
        });
    }
    function editProduct(index) { openProductModal(index); }
    async function deleteProduct(index) {
        if (!confirm('确定删除该产品吗？')) return;
        productsData.splice(index, 1);
        try {
            await saveData('products', productsData, token, '删除产品');
            renderProductTable();
        } catch (err) {
            alert('删除失败：' + err.message);
            // 回滚
            loadProductsIfNeeded(true);
        }
    }

    /* ============================================================
       许可证 CRUD
       ============================================================ */
    function openLicenseModal(index) {
        const isEdit = index !== undefined;
        const l = isEdit ? licensesData[index] : {};
        document.getElementById('modalTitle').textContent = isEdit ? '编辑许可证' : '添加许可证';
        document.getElementById('modalBody').innerHTML = `
            <form id="licenseForm">
                <input type="hidden" id="licenseIndex" value="${isEdit ? index : ''}">
                <div class="form-group"><label>许可证密钥（明文）</label><input type="text" id="lKey" value="${isEdit ? escapeHtml(decodeObscure64(l.license_key)) : ''}" placeholder="例如 PLUX-AAAA1111" required></div>
                <div class="form-row">
                    <div class="form-group"><label>关联产品 ID</label><input type="number" id="lProductId" value="${l.product_id ?? ''}" required></div>
                    <div class="form-group"><label>到期日期</label><input type="date" id="lExpiry" value="${l.expiry_date || ''}" required></div>
                </div>
                <div class="form-group"><label>最大服务器数</label><input type="number" id="lMaxServers" value="${l.max_servers ?? 1}" min="1" required></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        `;
        openModal();

        document.getElementById('licenseForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const idx = document.getElementById('licenseIndex').value;
            const plainKey = document.getElementById('lKey').value.trim();
            if (!plainKey) { alert('请输入许可证密钥'); return; }
            const newLicense = {
                id: isEdit ? l.id : (licensesData.length ? Math.max(...licensesData.map(x => x.id || 0)) + 1 : 1),
                license_key: encodeObscure64(plainKey),
                product_id: parseInt(document.getElementById('lProductId').value),
                expiry_date: document.getElementById('lExpiry').value,
                max_servers: parseInt(document.getElementById('lMaxServers').value),
                activated_servers: isEdit ? (l.activated_servers || []) : []
            };
            if (idx === '') licensesData.push(newLicense);
            else licensesData[parseInt(idx)] = newLicense;

            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = '保存中…';
            try {
                await saveData('licenses', licensesData, token, '更新许可证列表');
                renderLicenseTable();
                closeModal();
            } catch (err) {
                alert('保存失败：' + err.message);
                submitBtn.disabled = false;
                submitBtn.textContent = '保存';
            }
        });
    }
    function editLicense(index) { openLicenseModal(index); }
    async function deleteLicense(index) {
        if (!confirm('确定删除该许可证吗？')) return;
        licensesData.splice(index, 1);
        try {
            await saveData('licenses', licensesData, token, '删除许可证');
            renderLicenseTable();
        } catch (err) {
            alert('删除失败：' + err.message);
            loadLicensesIfNeeded(true);
        }
    }

    /* ============================================================
       插件 CRUD
       ============================================================ */
    function openPluginModal(index) {
        const isEdit = index !== undefined;
        const p = isEdit ? pluginsData[index] : {};
        document.getElementById('modalTitle').textContent = isEdit ? '编辑插件' : '添加插件';
        document.getElementById('modalBody').innerHTML = `
            <form id="pluginForm">
                <input type="hidden" id="pluginIndex" value="${isEdit ? index : ''}">
                <div class="form-row">
                    <div class="form-group"><label>插件名称 *</label><input type="text" id="plTitle" value="${escapeHtml(p.title || p.name || '')}" required></div>
                    <div class="form-group"><label>版本 *</label><input type="text" id="plVersion" value="${escapeHtml(p.version || '')}" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>MC 版本 *</label><input type="text" id="plMc" value="${escapeHtml(p.mc_version || '')}" required></div>
                    <div class="form-group"><label>发布日期</label><input type="date" id="plDate" value="${p.date || ''}"></div>
                </div>
                <div class="form-group"><label>下载链接 *</label><input type="url" id="plUrl" value="${escapeHtml(p.download_url || '')}" required></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        `;
        openModal();

        document.getElementById('pluginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const idx = document.getElementById('pluginIndex').value;
            const newPlugin = {
                title: document.getElementById('plTitle').value.trim(),
                version: document.getElementById('plVersion').value.trim(),
                mc_version: document.getElementById('plMc').value.trim(),
                date: document.getElementById('plDate').value || new Date().toISOString().slice(0, 10),
                download_url: document.getElementById('plUrl').value.trim()
            };
            if (idx === '') pluginsData.push(newPlugin);
            else pluginsData[parseInt(idx)] = newPlugin;

            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = '保存中…';
            try {
                await saveData(currentPluginFile, pluginsData, token, `更新 ${currentPluginFile}`);
                renderPluginTable();
                closeModal();
            } catch (err) {
                alert('保存失败：' + err.message);
                submitBtn.disabled = false;
                submitBtn.textContent = '保存';
            }
        });
    }
    function editPlugin(index) { openPluginModal(index); }
    async function deletePlugin(index) {
        if (!confirm('确定删除该插件吗？')) return;
        pluginsData.splice(index, 1);
        try {
            await saveData(currentPluginFile, pluginsData, token, `删除 ${currentPluginFile}`);
            renderPluginTable();
        } catch (err) {
            alert('删除失败：' + err.message);
            loadPluginsIfNeeded(true);
        }
    }

    /* ============================================================
       模态框
       ============================================================ */
    function openModal() {
        document.getElementById('modalOverlay').classList.add('active');
    }
    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('active');
    }
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    /* ============================================================
       暴露到全局（供 HTML onclick 调用）
       ============================================================ */
    window.login = login;
    window.logout = logout;
    window.refreshAll = refreshAll;
    window.loadProductsIfNeeded = loadProductsIfNeeded;
    window.loadLicensesIfNeeded = loadLicensesIfNeeded;
    window.loadPluginsIfNeeded = loadPluginsIfNeeded;
    window.openProductModal = openProductModal;
    window.editProduct = editProduct;
    window.deleteProduct = deleteProduct;
    window.openLicenseModal = openLicenseModal;
    window.editLicense = editLicense;
    window.deleteLicense = deleteLicense;
    window.openPluginModal = openPluginModal;
    window.editPlugin = editPlugin;
    window.deletePlugin = deletePlugin;
    window.closeModal = closeModal;
    </script>
</body>
</html>
