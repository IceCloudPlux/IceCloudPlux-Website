<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 · IceCloud & Plux</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tab-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            transition: all var(--transition);
        }
        .tab-btn.active {
            background: var(--accent-gradient);
            color: #fff;
            border-color: transparent;
        }
        .panel {
            display: none;
        }
        .panel.active {
            display: block;
        }
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .sub-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .sub-tab {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all var(--transition);
        }
        .sub-tab.active {
            background: var(--accent-gradient);
            color: #fff;
            border-color: transparent;
        }
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="/shop.html" class="brand"><span class="highlight">IceCloud</span> &amp; Plux</a>
            <div class="nav-links">
                <a href="/shop.html">商店</a>
                <a href="/dashboard.html">仪表盘</a>
                <a href="/admin.html">管理</a>
                <span class="nav-divider"></span>
                <div class="theme-toggle" id="themeToggle" role="button" tabindex="0" aria-label="切换主题">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- 登录界面 -->
    <section class="login-section" id="loginSection">
        <div class="login-box">
            <h2>🔐 管理员登录</h2>
            <p>请输入您的 GitHub Personal Access Token（需 <code>repo</code> 权限）</p>
            <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx">
            <button class="btn btn-primary" onclick="login()" style="width:100%;">登录后台</button>
            <div class="error-msg" id="loginError"></div>
        </div>
    </section>

    <!-- 管理主界面 -->
    <section class="container" id="adminSection" style="padding-top: 100px; padding-bottom: 40px; display: none;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:24px;">
            <h1 style="font-size: 2rem; font-weight: 800;">⚙️ 管理后台</h1>
            <button class="btn btn-secondary" onclick="logout()">退出登录</button>
        </div>

        <!-- 主标签页 -->
        <div class="tab-bar">
            <button class="tab-btn active" data-panel="products">📦 产品管理</button>
            <button class="tab-btn" data-panel="licenses">🔑 许可证管理</button>
            <button class="tab-btn" data-panel="plugins">📁 插件管理</button>
        </div>

        <!-- ============================================================ -->
        <!-- 面板1: 产品管理 -->
        <!-- ============================================================ -->
        <div id="panel-products" class="panel active">
            <div class="action-bar">
                <h2 style="font-size:1.3rem;">产品列表</h2>
                <button class="btn btn-primary" onclick="openProductModal()">+ 添加产品</button>
            </div>
            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>ID</th><th>名称</th><th>版本</th><th>MC版本</th><th>价格</th><th>发布日期</th><th>下载链接</th><th>操作</th></tr></thead>
                        <tbody id="productTableBody"><tr><td colspan="8" style="text-align:center; color:var(--text-muted);">加载中…</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- 面板2: 许可证管理 -->
        <!-- ============================================================ -->
        <div id="panel-licenses" class="panel">
            <div class="action-bar">
                <h2 style="font-size:1.3rem;">许可证列表</h2>
                <button class="btn btn-primary" onclick="openLicenseModal()">+ 添加许可证</button>
            </div>
            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>ID</th><th>许可证 (Obscure64)</th><th>关联产品</th><th>到期日期</th><th>最大服务器</th><th>已激活</th><th>操作</th></tr></thead>
                        <tbody id="licenseTableBody"><tr><td colspan="7" style="text-align:center; color:var(--text-muted);">加载中…</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- 面板3: 插件管理（分类） -->
        <!-- ============================================================ -->
        <div id="panel-plugins" class="panel">
            <div class="action-bar">
                <h2 style="font-size:1.3rem;">插件列表</h2>
                <button class="btn btn-primary" onclick="openPluginModal()">+ 添加插件</button>
            </div>

            <!-- 子标签：插件分类 -->
            <div class="sub-tabs" id="pluginSubTabs">
                <button class="sub-tab active" data-file="icecloud_plugins">❄️ IceCloud</button>
                <button class="sub-tab" data-file="plux_plugins">✨ Plux</button>
                <button class="sub-tab" data-file="special_plugins">🔧 特殊插件</button>
            </div>

            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>名称</th><th>版本</th><th>MC版本</th><th>发布日期</th><th>下载链接</th><th>操作</th></tr></thead>
                        <tbody id="pluginTableBody"><tr><td colspan="6" style="text-align:center; color:var(--text-muted);">加载中…</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!-- ============================================================ -->
    <!-- 模态框（通用） -->
    <!-- ============================================================ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <div class="modal-header">
                <h3 id="modalTitle">标题</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody">
                <!-- 动态表单 -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>Made with <span class="heart">❤️</span> by IceCloud &amp; Plux Dev</p>
        </div>
    </footer>

    <script src="js/common.js"></script>
    <script>
        // ============================================================
        // 初始化
        // ============================================================
        initTheme();
        initNavbarScroll();
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);

        let token = getToken();
        let productsData = [];
        let licensesData = [];
        let pluginsData = [];
        let currentPluginFile = 'icecloud_plugins';

        // ============================================================
        // 登录 / 登出
        // ============================================================
        window.login = async function() {
            const inputToken = document.getElementById('tokenInput').value.trim();
            if (!inputToken) {
                document.getElementById('loginError').textContent = '请输入 Token';
                return;
            }
            token = inputToken;
            try {
                await getFileContent('README.md', token);
                setToken(token);
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminSection').style.display = 'block';
                loadAllData();
            } catch (err) {
                document.getElementById('loginError').textContent = 'Token 无效或无仓库权限: ' + err.message;
                token = '';
            }
        };

        window.logout = function() {
            if (confirm('确定退出登录吗？')) {
                clearToken();
                token = '';
                document.getElementById('loginSection').style.display = 'flex';
                document.getElementById('adminSection').style.display = 'none';
            }
        };

        // ============================================================
        // 主标签页切换
        // ============================================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                document.getElementById('panel-' + this.dataset.panel).classList.add('active');
                // 切换到插件面板时加载数据
                if (this.dataset.panel === 'plugins') {
                    loadPluginsData();
                }
            });
        });

        // ============================================================
        // 插件子标签切换
        // ============================================================
        document.querySelectorAll('#pluginSubTabs .sub-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('#pluginSubTabs .sub-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentPluginFile = this.dataset.file;
                loadPluginsData();
            });
        });

        // ============================================================
        // 数据加载
        // ============================================================
        async function loadAllData() {
            productsData = await loadData('products', token);
            licensesData = await loadData('licenses', token);
            renderProductTable();
            renderLicenseTable();
            await loadPluginsData();
        }

        async function loadPluginsData() {
            pluginsData = await loadData(currentPluginFile, token);
            renderPluginTable();
        }

        // ============================================================
        // 渲染产品表格
        // ============================================================
        function renderProductTable() {
            const tbody = document.getElementById('productTableBody');
            if (!productsData || productsData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:var(--text-muted);">暂无产品</td></tr>`;
                return;
            }
            tbody.innerHTML = productsData.map((p, idx) => `
                <tr>
                    <td>${p.id}</td>
                    <td>${escapeHtml(p.name)}</td>
                    <td>${escapeHtml(p.version)}</td>
                    <td>${escapeHtml(p.mc_version)}</td>
                    <td>¥${Number(p.price).toFixed(2)}</td>
                    <td>${escapeHtml(p.date)}</td>
                    <td><a href="${escapeHtml(p.download_url)}" target="_blank">链接</a></td>
                    <td>
                        <button class="btn btn-secondary" style="padding:4px 12px; font-size:0.8rem;" onclick="editProduct(${idx})">编辑</button>
                        <button class="btn btn-danger" style="padding:4px 12px; font-size:0.8rem;" onclick="deleteProduct(${idx})">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        // ============================================================
        // 渲染许可证表格
        // ============================================================
        function renderLicenseTable() {
            const tbody = document.getElementById('licenseTableBody');
            if (!licensesData || licensesData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-muted);">暂无许可证</td></tr>`;
                return;
            }
            tbody.innerHTML = licensesData.map((l, idx) => {
                const product = productsData.find(p => p.id === l.product_id);
                const productName = product ? product.name : '未知';
                return `
                    <tr>
                        <td>${l.id}</td>
                        <td><code>${escapeHtml(l.license_key)}</code></td>
                        <td>${escapeHtml(productName)}</td>
                        <td>${escapeHtml(l.expiry_date)}</td>
                        <td>${l.max_servers}</td>
                        <td>${(l.activated_servers || []).length}</td>
                        <td>
                            <button class="btn btn-secondary" style="padding:4px 12px; font-size:0.8rem;" onclick="editLicense(${idx})">编辑</button>
                            <button class="btn btn-danger" style="padding:4px 12px; font-size:0.8rem;" onclick="deleteLicense(${idx})">删除</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ============================================================
        // 渲染插件表格
        // ============================================================
        function renderPluginTable() {
            const tbody = document.getElementById('pluginTableBody');
            if (!pluginsData || pluginsData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-muted);">暂无插件数据</td></tr>`;
                return;
            }
            tbody.innerHTML = pluginsData.map((p, idx) => `
                <tr>
                    <td>${escapeHtml(p.title || p.name)}</td>
                    <td>${escapeHtml(p.version)}</td>
                    <td>${escapeHtml(p.mc_version)}</td>
                    <td>${escapeHtml(p.date)}</td>
                    <td><a href="${escapeHtml(p.download_url)}" target="_blank">链接</a></td>
                    <td>
                        <button class="btn btn-secondary" style="padding:4px 12px; font-size:0.8rem;" onclick="editPlugin(${idx})">编辑</button>
                        <button class="btn btn-danger" style="padding:4px 12px; font-size:0.8rem;" onclick="deletePlugin(${idx})">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        // ============================================================
        // 产品 CRUD
        // ============================================================
        window.openProductModal = function(index) {
            const isEdit = index !== undefined;
            const p = isEdit ? productsData[index] : null;
            document.getElementById('modalTitle').textContent = isEdit ? '编辑产品' : '添加产品';
            document.getElementById('modalBody').innerHTML = `
                <form id="productForm">
                    <input type="hidden" id="productIndex" value="${isEdit ? index : ''}">
                    <div class="form-row">
                        <div class="form-group"><label>产品名称 *</label><input type="text" id="pName" value="${isEdit ? escapeHtml(p.name) : ''}" required></div>
                        <div class="form-group"><label>版本 *</label><input type="text" id="pVersion" value="${isEdit ? escapeHtml(p.version) : ''}" required></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>MC 版本 *</label><input type="text" id="pMc" value="${isEdit ? escapeHtml(p.mc_version) : ''}" required></div>
                        <div class="form-group"><label>价格 (CNY) *</label><input type="number" step="0.01" id="pPrice" value="${isEdit ? p.price : ''}" required></div>
                    </div>
                    <div class="form-group"><label>描述</label><input type="text" id="pDesc" value="${isEdit ? escapeHtml(p.description || '') : ''}"></div>
                    <div class="form-row">
                        <div class="form-group"><label>发布日期 *</label><input type="date" id="pDate" value="${isEdit ? p.date : ''}" required></div>
                        <div class="form-group"><label>下载链接 *</label><input type="url" id="pUrl" value="${isEdit ? escapeHtml(p.download_url) : ''}" required></div>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            `;
            openModal();

            document.getElementById('productForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const idx = document.getElementById('productIndex').value;
                const newProduct = {
                    id: isEdit ? p.id : (productsData.length ? Math.max(...productsData.map(p => p.id)) + 1 : 1),
                    name: document.getElementById('pName').value.trim(),
                    version: document.getElementById('pVersion').value.trim(),
                    mc_version: document.getElementById('pMc').value.trim(),
                    price: parseFloat(document.getElementById('pPrice').value),
                    description: document.getElementById('pDesc').value.trim(),
                    date: document.getElementById('pDate').value,
                    download_url: document.getElementById('pUrl').value.trim()
                };
                if (idx === '') productsData.push(newProduct);
                else productsData[parseInt(idx)] = newProduct;
                await saveData('products', productsData, token, '更新产品列表');
                renderProductTable();
                closeModal();
            });
        };

        window.editProduct = function(index) { openProductModal(index); };

        window.deleteProduct = async function(index) {
            if (!confirm('确定删除该产品吗？')) return;
            productsData.splice(index, 1);
            await saveData('products', productsData, token, '删除产品');
            renderProductTable();
        };

        // ============================================================
        // 许可证 CRUD
        // ============================================================
        window.openLicenseModal = function(index) {
            const isEdit = index !== undefined;
            const l = isEdit ? licensesData[index] : null;
            document.getElementById('modalTitle').textContent = isEdit ? '编辑许可证' : '添加许可证';
            document.getElementById('modalBody').innerHTML = `
                <form id="licenseForm">
                    <input type="hidden" id="licenseIndex" value="${isEdit ? index : ''}">
                    <div class="form-group"><label>许可证密钥（明文）</label><input type="text" id="lKey" value="${isEdit ? decodeObscure64(l.license_key) : ''}" placeholder="例如 PLUX-AAAA1111" required></div>
                    <div class="form-row">
                        <div class="form-group"><label>关联产品 ID</label><input type="number" id="lProductId" value="${isEdit ? l.product_id : ''}" required></div>
                        <div class="form-group"><label>到期日期</label><input type="date" id="lExpiry" value="${isEdit ? l.expiry_date : ''}" required></div>
                    </div>
                    <div class="form-group"><label>最大服务器数</label><input type="number" id="lMaxServers" value="${isEdit ? l.max_servers : 1}" min="1" required></div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            `;
            openModal();

            document.getElementById('licenseForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const idx = document.getElementById('licenseIndex').value;
                const plainKey = document.getElementById('lKey').value.trim();
                if (!plainKey) { alert('请输入许可证密钥'); return; }
                const encodedKey = encodeObscure64(plainKey);
                const newLicense = {
                    id: isEdit ? l.id : (licensesData.length ? Math.max(...licensesData.map(l => l.id)) + 1 : 1),
                    license_key: encodedKey,
                    product_id: parseInt(document.getElementById('lProductId').value),
                    expiry_date: document.getElementById('lExpiry').value,
                    max_servers: parseInt(document.getElementById('lMaxServers').value),
                    activated_servers: isEdit ? (l.activated_servers || []) : []
                };
                if (idx === '') licensesData.push(newLicense);
                else licensesData[parseInt(idx)] = newLicense;
                await saveData('licenses', licensesData, token, '更新许可证列表');
                renderLicenseTable();
                closeModal();
            });
        };

        window.editLicense = function(index) { openLicenseModal(index); };

        window.deleteLicense = async function(index) {
            if (!confirm('确定删除该许可证吗？')) return;
            licensesData.splice(index, 1);
            await saveData('licenses', licensesData, token, '删除许可证');
            renderLicenseTable();
        };

        // ============================================================
        // 插件 CRUD
        // ============================================================
        window.openPluginModal = function(index) {
            const isEdit = index !== undefined;
            const p = isEdit ? pluginsData[index] : null;
            document.getElementById('modalTitle').textContent = isEdit ? '编辑插件' : '添加插件';
            document.getElementById('modalBody').innerHTML = `
                <form id="pluginForm">
                    <input type="hidden" id="pluginIndex" value="${isEdit ? index : ''}">
                    <div class="form-row">
                        <div class="form-group"><label>插件名称 *</label><input type="text" id="plTitle" value="${isEdit ? escapeHtml(p.title || p.name) : ''}" required></div>
                        <div class="form-group"><label>版本 *</label><input type="text" id="plVersion" value="${isEdit ? escapeHtml(p.version) : ''}" required></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>MC 版本 *</label><input type="text" id="plMc" value="${isEdit ? escapeHtml(p.mc_version) : ''}" required></div>
                        <div class="form-group"><label>发布日期</label><input type="date" id="plDate" value="${isEdit ? p.date : ''}"></div>
                    </div>
                    <div class="form-group"><label>下载链接 *</label><input type="url" id="plUrl" value="${isEdit ? escapeHtml(p.download_url) : ''}" required></div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            `;
            openModal();

            document.getElementById('pluginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const idx = document.getElementById('pluginIndex').value;
                const newPlugin = {
                    title: document.getElementById('plTitle').value.trim(),
                    version: document.getElementById('plVersion').value.trim(),
                    mc_version: document.getElementById('plMc').value.trim(),
                    date: document.getElementById('plDate').value || new Date().toISOString().slice(0,10),
                    download_url: document.getElementById('plUrl').value.trim()
                };
                if (idx === '') pluginsData.push(newPlugin);
                else pluginsData[parseInt(idx)] = newPlugin;
                await saveData(currentPluginFile, pluginsData, token, `更新 ${currentPluginFile} 列表`);
                renderPluginTable();
                closeModal();
            });
        };

        window.editPlugin = function(index) { openPluginModal(index); };

        window.deletePlugin = async function(index) {
            if (!confirm('确定删除该插件吗？')) return;
            pluginsData.splice(index, 1);
            await saveData(currentPluginFile, pluginsData, token, `删除 ${currentPluginFile} 插件`);
            renderPluginTable();
        };

        // ============================================================
        // 模态框通用
        // ============================================================
        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
        }

        window.closeModal = function() {
            document.getElementById('modalOverlay').classList.remove('active');
        };

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ============================================================
        // 工具函数
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // 自动登录
        // ============================================================
        if (token) {
            (async () => {
                try {
                    await getFileContent('README.md', token);
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('adminSection').style.display = 'block';
                    loadAllData();
                } catch (e) {
                    clearToken();
                    token = '';
                }
            })();
        }
    </script>
</body>
</html>
