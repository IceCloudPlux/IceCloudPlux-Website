<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - IceCloud & Plux</title>
    <style>
        :root { --bg-primary:#0b0d15; --bg-secondary:#131620; --bg-card:rgba(255,255,255,0.04); --text-primary:#e8eaf0; --text-secondary:#9ca3af; --border-color:rgba(255,255,255,0.06); --accent:#7c3aed; --accent-light:#a78bfa; --accent-gradient:linear-gradient(135deg,#7c3aed,#a855f7); }
        [data-theme="light"] { --bg-primary:#f8fafc; --bg-secondary:#ffffff; --bg-card:rgba(0,0,0,0.03); --text-primary:#0f172a; --text-secondary:#475569; --border-color:rgba(0,0,0,0.06); --accent:#7c3aed; --accent-light:#8b5cf6; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg-primary); color:var(--text-primary); display:flex; justify-content:center; align-items:center; min-height:100vh; padding:24px; transition:background 0.3s,color 0.3s; }
        .error-box { text-align:center; }
        .error-code { font-size:6rem; font-weight:800; background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .error-title { font-size:1.8rem; font-weight:700; margin:8px 0; }
        .error-desc { color:var(--text-secondary); margin-bottom:24px; }
        .btn-home { display:inline-block; padding:12px 32px; border-radius:30px; background:var(--accent-gradient); color:#fff; font-weight:700; transition:all 0.2s; }
        .btn-home:hover { transform:translateY(-2px); box-shadow:0 4px 20px rgba(124,58,237,0.4); }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-code">404</div>
        <div class="error-title">页面未找到</div>
        <p class="error-desc">您访问的页面不存在或已被移动。</p>
        <a href="/" class="btn-home">← 返回首页</a>
    </div>
    <script>
        const html=document.documentElement;
        html.setAttribute('data-theme', localStorage.getItem('theme')||'dark');
    </script>
</body>
</html>
