<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IceCloud & Plux · 赞助我们</title>
    <style>
        /* 复用相同的 CSS 变量和导航栏样式 */
        :root { --bg-primary:#0b0d15; --bg-secondary:#131620; --bg-card:rgba(255,255,255,0.04); --bg-nav:rgba(11,13,21,0.0); --text-primary:#e8eaf0; --text-secondary:#9ca3af; --text-muted:#6b7280; --border-color:rgba(255,255,255,0.06); --accent:#7c3aed; --accent-light:#a78bfa; --accent-gradient:linear-gradient(135deg,#7c3aed,#a855f7); --shadow:0 4px 24px rgba(0,0,0,0.4); --nav-blur:12px; }
        [data-theme="light"] { --bg-primary:#f8fafc; --bg-secondary:#ffffff; --bg-card:rgba(0,0,0,0.03); --bg-nav:rgba(248,250,252,0.0); --text-primary:#0f172a; --text-secondary:#475569; --text-muted:#94a3b8; --border-color:rgba(0,0,0,0.06); --accent:#7c3aed; --accent-light:#8b5cf6; --shadow:0 4px 24px rgba(0,0,0,0.08); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg-primary); color:var(--text-primary); line-height:1.6; transition:background 0.3s,color 0.3s; }
        a { color:inherit; text-decoration:none; }
        .container { max-width:800px; margin:0 auto; padding:0 24px; }
        .navbar { position:fixed; top:0; left:0; right:0; z-index:1000; padding:16px 0; transition:background 0.3s,box-shadow 0.3s; background:var(--bg-nav); border-bottom:1px solid transparent; }
        .navbar.scrolled { background:var(--bg-secondary); border-bottom-color:var(--border-color); box-shadow:0 2px 20px rgba(0,0,0,0.1); }
        [data-theme="light"] .navbar.scrolled { background:rgba(255,255,255,0.85); backdrop-filter:blur(var(--nav-blur)); }
        [data-theme="dark"] .navbar.scrolled { background:rgba(11,13,21,0.85); backdrop-filter:blur(var(--nav-blur)); }
        .navbar .container { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
        .brand { font-size:1.3rem; font-weight:700; }
        .brand .highlight { color:var(--accent-light); }
        .nav-links { display:flex; gap:20px; font-size:0.95rem; }
        .nav-links a { color:var(--text-secondary); }
        .nav-links a:hover { color:var(--text-primary); }
        .nav-divider { width:1px; height:24px; background:var(--border-color); }
        .theme-toggle { display:flex; align-items:center; gap:6px; cursor:pointer; }
        .theme-toggle .toggle-track { width:40px; height:22px; border-radius:30px; background:var(--border-color); position:relative; }
        .theme-toggle .toggle-thumb { width:18px; height:18px; border-radius:50%; background:white; position:absolute; top:2px; left:2px; transition:transform 0.3s; }
        [data-theme="dark"] .theme-toggle .toggle-track { background:var(--accent); }
        [data-theme="dark"] .theme-toggle .toggle-thumb { transform:translateX(18px); }
        .hero { padding:120px 0 40px; text-align:center; }
        .hero h1 { font-size:2.5rem; font-weight:800; }
        .hero p { color:var(--text-secondary); margin-top:8px; }
        .sponsor-card { background:var(--bg-card); border:1px solid var(--border-color); border-radius:16px; padding:32px; text-align:center; margin-top:32px; }
        .btn-afdian { display:inline-block; padding:14px 32px; border-radius:30px; background:var(--accent-gradient); color:#fff; font-weight:700; transition:all 0.2s; }
        .btn-afdian:hover { transform:translateY(-2px); box-shadow:0 4px 20px rgba(124,58,237,0.4); }
        .sponsor-note { font-size:0.85rem; color:var(--text-muted); margin-top:16px; }
        .sponsor-list { background:var(--bg-card); border:1px solid var(--border-color); border-radius:16px; padding:24px; margin-top:32px; text-align:center; }
        .sponsor-list h3 { font-size:1.2rem; font-weight:700; margin-bottom:16px; }
        .sponsor-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
        .sponsor-item { background:var(--bg-card); border:1px solid var(--border-color); border-radius:8px; padding:8px; font-size:0.9rem; color:var(--text-secondary); }
        .footer { padding:32px 0; border-top:1px solid var(--border-color); text-align:center; color:var(--text-muted); margin-top:48px; }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="/" class="brand"><span class="highlight">IceCloud</span>&nbsp;&amp;&nbsp;Plux</a>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="community">社区</a>
                <a href="sponsor">赞助</a>
                <a href="stats">运行统计</a>
                <span class="nav-divider"></span>
                <div class="theme-toggle" id="themeToggle" role="button" tabindex="0">
                    <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </div>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <h1>❤️ 赞助我们</h1>
            <p>您的每一份支持都是我们持续开发与维护的动力</p>
        </div>
    </section>

    <div class="container">
        <div class="sponsor-card">
            <h2 style="font-size:1.4rem; margin-bottom:12px;">📱 爱发电赞助</h2>
            <p style="color:var(--text-secondary); margin-bottom:20px;">点击下方按钮前往爱发电页面，选择金额或自定义金额支付</p>
            <a href="https://afdian.com/a/你的用户名" target="_blank" class="btn-afdian">💜 前往爱发电赞助</a>
            <p class="sponsor-note">赞助时请备注您的 Minecraft 用户名，以便我们记录</p>
        </div>

        <div class="sponsor-list">
            <h3>🏆 赞助者名单</h3>
            <div class="sponsor-grid" id="sponsorGrid">
                <p class="sponsor-item" style="grid-column:1/-1; text-align:center; color:var(--text-muted);">暂无赞助者，快来成为第一位支持者吧！</p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 IceCloud & Plux Dev</p>
    </footer>

    <script>
        (function(){
            const toggle=document.getElementById('themeToggle');
            const html=document.documentElement;
            html.setAttribute('data-theme', localStorage.getItem('theme')||'dark');
            toggle.addEventListener('click',()=>{
                const next=html.getAttribute('data-theme')==='dark'?'light':'dark';
                html.setAttribute('data-theme',next);
                localStorage.setItem('theme',next);
            });
            const navbar=document.getElementById('navbar');
            window.addEventListener('scroll',()=>navbar.classList.toggle('scrolled',window.pageYOffset>20));
        })();
    </script>
</body>
</html>
